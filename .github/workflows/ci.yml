name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Package Chrome extension
        run: npm run zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: jevfilterforx-chrome-${{ github.sha }}
          path: dist/jev-filter-for-x-*-chrome.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: jevfilterforx-chrome-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "JevFilterForX $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest
